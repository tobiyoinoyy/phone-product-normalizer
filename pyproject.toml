[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-product-normalizer"
version = "0.2.0"
description = "BiRefNet_dynamic phone product cutout and geometry pipeline"
readme = "DELIVERY.md"
requires-python = ">=3.9"
dependencies = [
  "Pillow>=10.0",
  "numpy<2",
  "torch>=2.5",
  "torchvision>=0.20",
  "transformers>=4.45,<5",
  "accelerate>=0.30",
  "huggingface-hub>=0.25",
  "safetensors>=0.4",
  "timm>=1.0",
  "kornia>=0.7",
  "einops>=0.7",
  "opencv-python-headless>=4.8",
]

[project.scripts]
phone-normalizer = "phone_normalizer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["phone_normalizer*", "scripts*"]
exclude = ["tests*", "outputs*", "inputs*", "research*"]
